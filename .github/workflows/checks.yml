name: Reusable checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Windows Python ${{ matrix.python }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync python scripts/check_release.py
      - run: uv run --no-sync pytest -q -m "not integration" --junitxml=outputs/unit-tests.xml
      - run: uv run --no-sync python scripts/smoke_mcp.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-python-${{ matrix.python }}
          path: outputs/*.xml
          retention-days: 14

  mysql:
    name: MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked --python 3.13
      - name: Disposable database integration tests
        shell: pwsh
        run: ./scripts/test-docker.ps1 -Image 'mysql:${{ matrix.mysql }}' -ReportName mysql-integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mysql-${{ matrix.mysql }}-reports
          path: outputs/mysql-integration.*
          retention-days: 14
