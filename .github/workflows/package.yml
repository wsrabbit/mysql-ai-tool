name: Reusable Windows package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked --group build --python 3.13
      - run: uv run --no-sync python scripts/check_release.py
      - name: Build and check frozen MCP
        id: build
        run: uv run --no-sync python scripts/build_release.py
      - name: Verify installation and removal in an isolated directory
        shell: powershell
        env:
          RELEASE_DIRECTORY: ${{ steps.build.outputs.release_directory }}
        run: ./scripts/smoke_install.ps1 -ReleaseDirectory $env:RELEASE_DIRECTORY
      - run: uv run --no-sync python scripts/package_source.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            outputs/mysql-ai-tools-*.zip
            outputs/mysql-ai-tools-*.sha256
          if-no-files-found: error
          retention-days: 14
